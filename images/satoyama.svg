  <path d="M0 176 C 120 158, 270 192, 400 170 L400 206 C 270 228, 120 194, 0 212 Z" fill="#DDBE5C"></path>
  <path d="M0 212 C 120 194, 270 228, 400 206 L400 244 C 270 266, 120 232, 0 250 Z" fill="#AFBB92"></path>
  <path d="M0 250 C 120 232, 270 266, 400 244 L400 300 L0 300 Z" fill="#C9B173"></path>
  <g stroke="#8E9A6B" stroke-width="2" opacity="0.55" fill="none">
