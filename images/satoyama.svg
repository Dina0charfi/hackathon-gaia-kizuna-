<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration: a mixed landscape where woodland, cultivated plots and a small village meet with soft boundaries" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="400" height="300" fill="#EDE7CE"></rect>
  <path d="M0 92 C 80 60, 170 104, 250 74 C 320 48, 364 80, 400 66 L400 300 L0 300 Z" fill="#C3CBA8"></path>

  <!-- woodland -->
  <g fill="#6B7551">
    <ellipse cx="34" cy="116" rx="26" ry="20"></ellipse>
    <ellipse cx="78" cy="106" rx="22" ry="17"></ellipse>
    <ellipse cx="118" cy="118" rx="25" ry="19"></ellipse>
    <ellipse cx="56" cy="138" rx="24" ry="18"></ellipse>
    <ellipse cx="100" cy="142" rx="20" ry="15"></ellipse>
  </g>
  <g fill="#5B6645" opacity="0.8">
